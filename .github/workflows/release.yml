name: Release

# Push a tag like v0.3.0 and this attaches the arm64 APK to a GitHub Release.
# Or run it by hand (Actions -> Release -> Run workflow) on main: it then makes
# the tag itself, v + the version in pubspec.yaml unless one is typed in, on
# the commit it built - for when a tag cannot be pushed from where you are.
# The panels find it there: the app checks releases/latest and installs it
# through the panel's own adb daemon when HA says so. The APK is signed with
# the project's keystore from the repository secrets, so it installs over
# what is on the panels; an APK with another signature is refused by Android.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.7.0 (empty: v + the version in pubspec.yaml)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Signing key
        run: |
          if [ -z "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "::error::KEYSTORE_B64 secret missing - the APK would not install over the panels' current one"; exit 1
          fi
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      # A pushed tag names itself; a manual run takes the input, else pubspec's
      # version without its build number (0.7.0+17 -> v0.7.0).
      - name: Tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="v$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          fi
          echo "Releasing $tag from ${{ github.sha }}"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --split-per-abi

      - uses: softprops/action-gh-release@v2
        with:
          # makes the tag on this commit when it does not exist yet
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          generate_release_notes: true
